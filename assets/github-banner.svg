<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="50%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Animated Shimmer Gradient for Name -->
    <linearGradient id="name-shimmer" x1="0%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="75%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>

    <!-- Subtle Radial Glows -->
    <radialGradient id="glow-cyan" cx="20%" cy="25%" r="60%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#0284C7" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glow-purple" cx="80%" cy="75%" r="60%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.2"/>
      <stop offset="60%" stop-color="#6366F1" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Border Gradient -->
    <linearGradient id="border-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.7"/>
      <stop offset="35%" stop-color="#1E293B" stop-opacity="0.8"/>
      <stop offset="65%" stop-color="#1E293B" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Dot Pattern -->
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#334155" fill-opacity="0.3"/>
    </pattern>
  </defs>

  <style>
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif; }
    
    /* Keyframe Animations */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.7; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.08); }
    }

    @keyframes textShimmer {
      0% { stop-color: #FFFFFF; }
      25% { stop-color: #38BDF8; }
      50% { stop-color: #A855F7; }
      75% { stop-color: #34D399; }
      100% { stop-color: #FFFFFF; }
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    @keyframes beaconPulse {
      0% { r: 4px; opacity: 1; }
      50% { r: 8px; opacity: 0.3; }
      100% { r: 12px; opacity: 0; }
    }

    @keyframes floatCard {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }

    .animated-beacon {
      animation: beaconPulse 2s infinite ease-out;
      transform-origin: 14px 13px;
    }

    .animated-cursor {
      animation: blink 1s infinite step-start;
    }

    .shimmer-text {
      background: linear-gradient(90deg, #FFFFFF, #38BDF8, #818CF8, #FFFFFF);
      background-size: 200% auto;
    }

    .floating-pane {
      animation: floatCard 4s ease-in-out infinite;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="320" fill="url(#bg)" rx="14"/>
  <rect width="1200" height="320" fill="url(#grid)" rx="14"/>
  <rect width="1200" height="320" fill="url(#glow-cyan)" rx="14"/>
  <rect width="1200" height="320" fill="url(#glow-purple)" rx="14"/>

  <!-- Border -->
  <rect x="1" y="1" width="1198" height="318" rx="13" fill="none" stroke="url(#border-glow)" stroke-width="1.5"/>

  <!-- Top Status Bar -->
  <g transform="translate(40, 28)">
    <!-- Active Pill -->
    <rect width="162" height="26" rx="13" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
    <!-- Animated Beacon -->
    <circle cx="14" cy="13" r="4" fill="#10B981"/>
    <circle cx="14" cy="13" r="8" fill="none" stroke="#10B981" class="animated-beacon"/>
    <text x="26" y="17" fill="#E2E8F0" class="font-mono" font-size="10.5" font-weight="600">AVAILABLE FOR ROLES</text>

    <!-- Location Pill -->
    <g transform="translate(174, 0)">
      <rect width="210" height="26" rx="13" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
      <text x="14" y="17" fill="#94A3B8" class="font-mono" font-size="10.5">📍 SKCT '27 • COIMBATORE</text>
    </g>

    <!-- Right Header Tag -->
    <text x="1120" y="17" text-anchor="end" fill="#64748B" class="font-mono" font-size="11">SDE // FULL-STACK • 3D WEB • APPLIED AI</text>
  </g>

  <!-- Left Main Content -->
  <g transform="translate(40, 90)">
    <!-- Subtitle Role -->
    <text x="0" y="16" fill="#38BDF8" class="font-mono" font-size="13" font-weight="700" letter-spacing="0.16em">
      ASPIRING SDE &amp; AI ENGINEER
    </text>

    <!-- Main Name with Gradient -->
    <text x="0" y="72" fill="url(#name-shimmer)" class="font-sans" font-size="56" font-weight="900" letter-spacing="-0.03em">
      Ashwath S
    </text>

    <!-- Concise Positioning Statement -->
    <text x="0" y="108" fill="#94A3B8" class="font-sans" font-size="16" font-weight="400">
      Building scalable distributed systems, interactive 3D WebGL simulations &amp; GenAI architectures.
    </text>

    <!-- Minimal Tech Badges -->
    <g transform="translate(0, 140)">
      <!-- Badge: Java & Spring Boot -->
      <g transform="translate(0, 0)">
        <rect width="136" height="28" rx="6" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
        <circle cx="12" cy="14" r="3" fill="#34D399"/>
        <text x="22" y="18" fill="#E2E8F0" class="font-mono" font-size="11" font-weight="500">Spring Boot · Java</text>
      </g>

      <!-- Badge: React & TypeScript -->
      <g transform="translate(144, 0)">
        <rect width="140" height="28" rx="6" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
        <circle cx="12" cy="14" r="3" fill="#38BDF8"/>
        <text x="22" y="18" fill="#E2E8F0" class="font-mono" font-size="11" font-weight="500">React · TypeScript</text>
      </g>

      <!-- Badge: Three.js -->
      <g transform="translate(292, 0)">
        <rect width="128" height="28" rx="6" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
        <circle cx="12" cy="14" r="3" fill="#C084FC"/>
        <text x="22" y="18" fill="#E2E8F0" class="font-mono" font-size="11" font-weight="500">Three.js · WebGL</text>
      </g>

      <!-- Badge: Python & FastAPI -->
      <g transform="translate(428, 0)">
        <rect width="130" height="28" rx="6" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
        <circle cx="12" cy="14" r="3" fill="#FBBF24"/>
        <text x="22" y="18" fill="#E2E8F0" class="font-mono" font-size="11" font-weight="500">FastAPI · Python</text>
      </g>

      <!-- Badge: MySQL & Cloud -->
      <g transform="translate(566, 0)">
        <rect width="112" height="28" rx="6" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
        <circle cx="12" cy="14" r="3" fill="#60A5FA"/>
        <text x="22" y="18" fill="#E2E8F0" class="font-mono" font-size="11" font-weight="500">MySQL · AWS</text>
      </g>
    </g>
  </g>

  <!-- Right Floating Terminal Pane -->
  <g transform="translate(750, 78)" class="floating-pane">
    <rect width="410" height="202" rx="10" fill="#090E17" stroke="#1E293B" stroke-width="1.2"/>

    <!-- Terminal Header -->
    <path d="M 0 10 C 0 4.477 4.477 0 10 0 L 400 0 C 405.523 0 410 4.477 410 10 L 410 30 L 0 30 Z" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
    <circle cx="16" cy="15" r="4" fill="#EF4444"/>
    <circle cx="30" cy="15" r="4" fill="#F59E0B"/>
    <circle cx="44" cy="15" r="4" fill="#10B981"/>
    <text x="205" y="19" text-anchor="middle" fill="#64748B" class="font-mono" font-size="11">ashwath@dev ~</text>

    <!-- Terminal Output -->
    <g transform="translate(18, 50)" class="font-mono" font-size="11.5">
      <text x="0" y="0">
        <tspan fill="#38BDF8">❯</tspan> <tspan fill="#F8FAFC">ashwath --status</tspan>
      </text>

      <text x="0" y="22" fill="#94A3B8">
        • B.E. CSE (2023–2027) @ SKCT
      </text>

      <text x="0" y="42" fill="#94A3B8">
        • Flagships: <tspan fill="#38BDF8">ALGO3D</tspan> • <tspan fill="#34D399">ARCHON</tspan> • <tspan fill="#FBBF24">Smart Campus</tspan>
      </text>

      <text x="0" y="62" fill="#94A3B8">
        • Stack: Java, Spring Boot, React, Three.js, Python
      </text>

      <!-- Animated Prompt Line -->
      <g transform="translate(0, 84)">
        <text x="0" y="14" font-size="11.5">
          <tspan fill="#38BDF8">❯</tspan> <tspan fill="#10B981">ready_to_build</tspan><tspan fill="#38BDF8" class="animated-cursor">_</tspan>
        </text>
      </g>
    </g>
  </g>

  <!-- Bottom Accent Line -->
  <line x1="40" y1="295" x2="1160" y2="295" stroke="#1E293B" stroke-width="1"/>
</svg>
