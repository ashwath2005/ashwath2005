<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="50%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#02040A"/>
    </linearGradient>

    <!-- Radial Glow Elements -->
    <radialGradient id="cyan-glow" cx="15%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#0284C7" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="violet-glow" cx="85%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="emerald-glow" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Border Gradient -->
    <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.5"/>
      <stop offset="25%" stop-color="#1E293B" stop-opacity="0.8"/>
      <stop offset="75%" stop-color="#1E293B" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Header Text Gradient -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <!-- Dot Matrix Pattern -->
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#334155" fill-opacity="0.4"/>
    </pattern>

    <!-- Card Background -->
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#070D18" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <style>
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif; }
    .hero-name { font-weight: 900; letter-spacing: -0.03em; }
    .badge-label { font-weight: 600; font-size: 11px; letter-spacing: 0.05em; }
  </style>

  <!-- Background Base -->
  <rect width="1280" height="400" fill="url(#bg)" rx="16"/>
  <rect width="1280" height="400" fill="url(#dots)" rx="16"/>
  <rect width="1280" height="400" fill="url(#cyan-glow)" rx="16"/>
  <rect width="1280" height="400" fill="url(#violet-glow)" rx="16"/>
  <rect width="1280" height="400" fill="url(#emerald-glow)" rx="16"/>

  <!-- Outer Elegant Frame -->
  <rect x="1.5" y="1.5" width="1277" height="397" rx="15" fill="none" stroke="url(#card-border)" stroke-width="1.5"/>

  <!-- Top System Bar -->
  <g transform="translate(48, 36)">
    <!-- Status Pill -->
    <rect width="168" height="26" rx="13" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
    <circle cx="14" cy="13" r="4" fill="#10B981"/>
    <circle cx="14" cy="13" r="7" fill="none" stroke="#10B981" stroke-opacity="0.4" stroke-width="1.2"/>
    <text x="28" y="17" fill="#E2E8F0" class="font-mono" font-size="11" font-weight="600">AVAILABLE FOR WORK</text>

    <!-- Subtitle Pill -->
    <g transform="translate(180, 0)">
      <rect width="210" height="26" rx="13" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
      <text x="14" y="17" fill="#38BDF8" class="font-mono" font-size="11" font-weight="600">ENGINEERING PORTFOLIO</text>
    </g>

    <!-- Version / Architecture Badge -->
    <text x="1184" y="17" text-anchor="end" fill="#64748B" class="font-mono" font-size="11">SYSTEM_ID: ASHWATH-V2 // FULLSTACK &amp; 3D</text>
  </g>

  <!-- Left Main Hero -->
  <g transform="translate(48, 100)">
    <!-- Subtitle Tag -->
    <text x="0" y="20" fill="url(#accent-grad)" class="font-mono" font-size="14" font-weight="700" letter-spacing="0.12em">
      FULL STACK DEVELOPER • AI/ML ENTHUSIAST
    </text>

    <!-- Main Large Name -->
    <text x="0" y="80" fill="url(#title-grad)" class="font-sans hero-name" font-size="64">
      Ashwath S
    </text>

    <!-- Clean Positioning Description -->
    <text x="0" y="122" fill="#94A3B8" class="font-sans" font-size="18" font-weight="400">
      Crafting scalable full-stack architectures, interactive 3D computing &amp; intelligent tools.
    </text>

    <!-- Interactive Quick Badges -->
    <g transform="translate(0, 160)">
      <!-- Badge: React -->
      <g transform="translate(0, 0)">
        <rect width="90" height="32" rx="8" fill="url(#card-bg)" stroke="#1E293B" stroke-width="1.2"/>
        <circle cx="16" cy="16" r="3.5" fill="#38BDF8"/>
        <text x="28" y="20" fill="#F1F5F9" class="font-mono badge-label">react</text>
      </g>

      <!-- Badge: Spring Boot -->
      <g transform="translate(100, 0)">
        <rect width="130" height="32" rx="8" fill="url(#card-bg)" stroke="#1E293B" stroke-width="1.2"/>
        <circle cx="16" cy="16" r="3.5" fill="#34D399"/>
        <text x="28" y="20" fill="#F1F5F9" class="font-mono badge-label">spring boot</text>
      </g>

      <!-- Badge: Three.js -->
      <g transform="translate(240, 0)">
        <rect width="105" height="32" rx="8" fill="url(#card-bg)" stroke="#1E293B" stroke-width="1.2"/>
        <circle cx="16" cy="16" r="3.5" fill="#C084FC"/>
        <text x="28" y="20" fill="#F1F5F9" class="font-mono badge-label">three.js</text>
      </g>

      <!-- Badge: Python / AI -->
      <g transform="translate(355, 0)">
        <rect width="125" height="32" rx="8" fill="url(#card-bg)" stroke="#1E293B" stroke-width="1.2"/>
        <circle cx="16" cy="16" r="3.5" fill="#FBBF24"/>
        <text x="28" y="20" fill="#F1F5F9" class="font-mono badge-label">python · ai</text>
      </g>

      <!-- Badge: Cloud / DevOps -->
      <g transform="translate(490, 0)">
        <rect width="120" height="32" rx="8" fill="url(#card-bg)" stroke="#1E293B" stroke-width="1.2"/>
        <circle cx="16" cy="16" r="3.5" fill="#60A5FA"/>
        <text x="28" y="20" fill="#F1F5F9" class="font-mono badge-label">cloud / dsa</text>
      </g>
    </g>
  </g>

  <!-- Right Side Interactive Architecture Glass Card -->
  <g transform="translate(800, 85)">
    <!-- Container Box -->
    <rect width="432" height="258" rx="14" fill="url(#card-bg)" stroke="#1E293B" stroke-width="1.5"/>

    <!-- Window Header -->
    <path d="M 0 14 C 0 6.268 6.268 0 14 0 L 418 0 C 425.732 0 432 6.268 432 14 L 432 38 L 0 38 Z" fill="#0F172A" stroke="#1E293B" stroke-width="1.2"/>
    <circle cx="20" cy="19" r="4.5" fill="#EF4444" fill-opacity="0.85"/>
    <circle cx="36" cy="19" r="4.5" fill="#F59E0B" fill-opacity="0.85"/>
    <circle cx="52" cy="19" r="4.5" fill="#10B981" fill-opacity="0.85"/>
    <text x="216" y="23" text-anchor="middle" fill="#64748B" class="font-mono" font-size="11">system-profile.json</text>

    <!-- JSON Code Display -->
    <g transform="translate(24, 62)" class="font-mono" font-size="12">
      <text x="0" y="0" fill="#F8FAFC">{</text>
      
      <text x="16" y="20">
        <tspan fill="#38BDF8">"engineer"</tspan><tspan fill="#94A3B8">:</tspan> <tspan fill="#34D399">"Ashwath S"</tspan><tspan fill="#94A3B8">,</tspan>
      </text>

      <text x="16" y="40">
        <tspan fill="#38BDF8">"education"</tspan><tspan fill="#94A3B8">:</tspan> <tspan fill="#F8FAFC">"B.E. Computer Science"</tspan><tspan fill="#94A3B8">,</tspan>
      </text>

      <text x="16" y="60">
        <tspan fill="#38BDF8">"flagships"</tspan><tspan fill="#94A3B8">:</tspan> <tspan fill="#F8FAFC">[</tspan><tspan fill="#FBBF24">"ALGO3D"</tspan><tspan fill="#94A3B8">, </tspan><tspan fill="#FBBF24">"ZENTIQ"</tspan><tspan fill="#F8FAFC">]</tspan><tspan fill="#94A3B8">,</tspan>
      </text>

      <text x="16" y="80">
        <tspan fill="#38BDF8">"interests"</tspan><tspan fill="#94A3B8">:</tspan> <tspan fill="#F8FAFC">[</tspan><tspan fill="#C084FC">"3D Web"</tspan><tspan fill="#94A3B8">, </tspan><tspan fill="#C084FC">"Spring Boot"</tspan><tspan fill="#94A3B8">, </tspan><tspan fill="#C084FC">"AI"</tspan><tspan fill="#F8FAFC">]</tspan><tspan fill="#94A3B8">,</tspan>
      </text>

      <text x="16" y="100">
        <tspan fill="#38BDF8">"portfolio"</tspan><tspan fill="#94A3B8">:</tspan> <tspan fill="#38BDF8">"ashwath-s-portfolio"</tspan><tspan fill="#94A3B8">,</tspan>
      </text>

      <text x="16" y="120">
        <tspan fill="#38BDF8">"status"</tspan><tspan fill="#94A3B8">:</tspan> <tspan fill="#10B981">"open to opportunities"</tspan>
      </text>

      <text x="0" y="142" fill="#F8FAFC">}</text>

      <!-- Interactive Shell Prompt Line -->
      <g transform="translate(0, 168)">
        <rect width="384" height="24" rx="5" fill="#030712" stroke="#1E293B" stroke-width="1"/>
        <text x="10" y="16" font-size="11">
          <tspan fill="#38BDF8">❯</tspan> <tspan fill="#94A3B8">ashwath --ready --deploy</tspan> <tspan fill="#10B981">✓</tspan>
        </text>
      </g>
    </g>
  </g>

  <!-- Bottom Accent Highlights -->
  <line x1="48" y1="368" x2="1232" y2="368" stroke="#1E293B" stroke-width="1"/>
  <circle cx="48" cy="368" r="2.5" fill="#38BDF8"/>
  <circle cx="1232" cy="368" r="2.5" fill="#A855F7"/>
</svg>
