<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="100%" height="200" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="50%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Animated Shimmer Gradient for Name -->
    <linearGradient id="shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF">
        <animate attributeName="stop-color" values="#FFFFFF; #38BDF8; #818CF8; #34D399; #FFFFFF" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#38BDF8">
        <animate attributeName="stop-color" values="#38BDF8; #818CF8; #34D399; #FFFFFF; #38BDF8" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#818CF8">
        <animate attributeName="stop-color" values="#818CF8; #34D399; #FFFFFF; #38BDF8; #818CF8" dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Glowing Border Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#1E293B" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Ambient Glows -->
    <radialGradient id="cyan-glow" cx="15%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="purple-glow" cx="85%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    
    @keyframes blinkCursor {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    @keyframes pulseGlow {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 0.9; }
    }

    .cursor {
      animation: blinkCursor 1s infinite;
    }

    .status-pulse {
      animation: pulseGlow 2s ease-in-out infinite;
    }
  </style>

  <!-- Background Base -->
  <rect width="900" height="200" fill="url(#bg)" rx="12"/>
  <rect width="900" height="200" fill="url(#cyan-glow)" rx="12"/>
  <rect width="900" height="200" fill="url(#purple-glow)" rx="12"/>

  <!-- Crisp Border Frame -->
  <rect x="1" y="1" width="898" height="198" rx="11" fill="none" stroke="url(#border-grad)" stroke-width="1.2"/>

  <!-- Top Status Row -->
  <g transform="translate(36, 32)">
    <!-- Active Status -->
    <circle cx="6" cy="6" r="4" fill="#10B981"/>
    <circle cx="6" cy="6" r="7" fill="none" stroke="#10B981" stroke-width="1" class="status-pulse"/>
    <text x="18" y="10" fill="#E2E8F0" class="mono" font-size="11" font-weight="600" letter-spacing="0.05em">AVAILABLE FOR OPPORTUNITIES</text>

    <!-- Meta Info Right -->
    <text x="828" y="10" text-anchor="end" fill="#64748B" class="mono" font-size="11">COIMBATORE, TN • SKCT '27</text>
  </g>

  <!-- Main Hero Name -->
  <g transform="translate(36, 96)">
    <text x="0" y="0" fill="url(#shimmer)" class="sans" font-size="44" font-weight="800" letter-spacing="-0.02em">
      Ashwath S
    </text>
  </g>

  <!-- Animated Terminal Command Line Subtitle -->
  <g transform="translate(36, 134)" class="mono">
    <text x="0" y="0" font-size="14">
      <tspan fill="#38BDF8">❯</tspan> <tspan fill="#E2E8F0">Aspiring SDE &amp; AI Engineer</tspan> <tspan fill="#64748B">|</tspan> <tspan fill="#94A3B8">Full-Stack • 3D WebGL • Spring Boot</tspan><tspan fill="#38BDF8" class="cursor">_</tspan>
    </text>
  </g>

  <!-- Minimal Tech Tags Row -->
  <g transform="translate(36, 168)" class="mono" font-size="11.5" fill="#64748B">
    <text x="0" y="0">
      <tspan fill="#34D399">Java</tspan> • <tspan fill="#34D399">Spring Boot</tspan> • <tspan fill="#38BDF8">React</tspan> • <tspan fill="#38BDF8">TypeScript</tspan> • <tspan fill="#C084FC">Three.js</tspan> • <tspan fill="#FBBF24">Python</tspan> • <tspan fill="#FBBF24">FastAPI</tspan> • <tspan fill="#60A5FA">MySQL</tspan> • <tspan fill="#F59E0B">AWS</tspan>
    </text>
  </g>
</svg>
